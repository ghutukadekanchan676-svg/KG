/* SEARCH */

function searchMedicine(){

    const searchText =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const filtered = medicineData.filter(function(medicine){

        const text = (

            medicine.generic + " " +
            medicine.brand + " " +
            medicine.disease + " " +
            medicine.uses + " " +
            medicine.moa + " " +
            medicine.sideEffects + " " +
            medicine.icd10

        ).toLowerCase();

        return text.includes(searchText);

    });

    renderMedicines(filtered);
}


/* DISPLAY */

function renderMedicines(data){

    const list =
        document.getElementById("medicineList");

    const count =
        document.getElementById("count");

    count.textContent =
        data.length + " Medicines Found";

    list.innerHTML = "";

    if(data.length === 0){

        list.innerHTML = `
            <div class="no-result">
                No medicine found
            </div>
        `;

        return;
    }

    data.forEach(function(medicine){

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <h2>${medicine.generic}</h2>

            <div class="info">
                <span class="label">
                    Brand Name:
                </span>
                ${medicine.brand}
            </div>

            <div class="info disease">
                <span class="label">
                    Associated Disease:
                </span>
                ${medicine.disease}
            </div>

            <div class="info">
                <span class="label">
                    Uses:
                </span>
                ${medicine.uses}
            </div>

            <div class="info moa">
                <span class="label">
                    Mechanism of Action (MOA):
                </span>
                ${medicine.moa}
            </div>

            <div class="info">
                <span class="label">
                    Adverse Effects:
                </span>
                ${medicine.sideEffects}
            </div>

            <div class="info">
                <span class="label">
                    ICD-10:
                </span>

                <span class="icd">
                    ${medicine.icd10}
                </span>
            </div>

        `;

        list.appendChild(card);

    });
}


/* START */
